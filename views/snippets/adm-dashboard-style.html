{{-- Shared look of the admin (/admin) and moderator (/mod) dashboards: .adm-* classes --}}
  <style>
    /* Admin & moderator dashboards — square, flat, theme colours (same rules as the modals) */
    .adm {
      --adm-accent: var(--accent, #0096ff);
      --adm-text: var(--text-color, var(--white, #fff));
      --adm-muted: var(--text-muted, #8a8f98);
      --adm-surface: rgba(255, 255, 255, 0.04);
      --adm-border: rgba(255, 255, 255, 0.1);
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      text-align: left;
      color: var(--adm-text);
      line-height: 1.5;
    }
    .adm *, .adm *::before, .adm *::after { border-radius: 0 !important; }

    .adm-header {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding-bottom: 18px; margin-bottom: 26px; border-bottom: 1px solid var(--adm-border);
    }
    .adm-title { margin: 0; font-size: 1.8em; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
    .adm-subtitle { margin-top: 6px; font-size: 0.85em; color: var(--adm-muted); }
    .adm-subtitle strong { color: var(--adm-text); }

    .adm-section { margin-bottom: 34px; }
    .adm-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .adm-section-title {
      display: flex; align-items: center; gap: 10px; margin: 0 0 14px;
      font-size: 0.78em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--adm-muted);
    }
    .adm-section-title i { color: var(--adm-accent); }
    .adm-section-title::after { content: ''; flex: 1; height: 1px; background: var(--adm-border); }
    .adm-section-head .adm-section-title { flex: 1; }
    .adm-group-title { margin: 18px 0 8px; font-size: 0.95em; font-weight: 700; color: var(--adm-text); }

    /* Overview tiles */
    .adm-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .adm-stat {
      display: flex; flex-direction: column; gap: 2px; padding: 14px 16px;
      background: var(--adm-surface); border: 1px solid var(--adm-border);
      color: var(--adm-text); text-decoration: none;
    }
    .adm-stat-num { font-size: 1.6em; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .adm-stat-label { font-size: 0.72em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--adm-muted); }
    .adm-stat-label small { text-transform: none; letter-spacing: 0; font-weight: 500; }
    .adm-stat-link { transition: border-color 0.15s; }
    .adm-stat-link:hover { border-color: var(--adm-accent); text-decoration: none; color: var(--adm-text); }
    .adm-stat.is-hot { border-color: var(--adm-accent); border-left: 3px solid var(--adm-accent); }
    .adm-stat.is-hot .adm-stat-num { color: var(--adm-accent); }

    /* Tool cards */
    .adm-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
    .adm-tool {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px;
      background: var(--adm-surface); border: 1px solid var(--adm-border);
      color: var(--adm-text); text-decoration: none; transition: border-color 0.15s, background 0.15s;
    }
    .adm-tool:hover { border-color: var(--adm-accent); background: rgba(255, 255, 255, 0.06); text-decoration: none; color: var(--adm-text); }
    .adm-tool > i { width: 20px; margin-top: 3px; text-align: center; color: var(--adm-accent); flex-shrink: 0; }
    .adm-tool-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .adm-tool-text strong { display: flex; align-items: center; gap: 8px; font-size: 0.92em; }
    .adm-tool-text > span { font-size: 0.78em; color: var(--adm-muted); }
    .adm-count { padding: 0 6px; font-size: 0.8em; line-height: 1.6; background: var(--adm-accent); color: #000; font-weight: 800; }

    /* Settings panels */
    .adm-panel { background: var(--adm-surface); border: 1px solid var(--adm-border); }
    .adm-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 16px; }
    .adm-row + .adm-row { border-top: 1px solid var(--adm-border); }
    .adm-row-wrap { flex-wrap: wrap; }
    .adm-row-text { min-width: 0; flex: 1 1 260px; }
    .adm-row-text label { display: block; margin: 0; font-weight: 700; font-size: 0.92em; color: var(--adm-text); }
    .adm-row-text p { margin: 3px 0 0; font-size: 0.8em; color: var(--adm-muted); }
    .adm-muted { font-size: 0.78em; font-style: italic; color: var(--adm-muted); }

    .adm-number {
      width: 76px; height: 36px; padding: 0 8px; text-align: center;
      background: rgba(0, 0, 0, 0.3); border: 1px solid var(--adm-border); color: var(--adm-text);
      font: inherit; outline: none; flex-shrink: 0;
    }
    .adm-number:focus { border-color: var(--adm-accent); }

    .adm-switch { position: relative; display: inline-block; width: 46px; height: 24px; flex-shrink: 0; cursor: pointer; }
    .adm-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .adm-slider { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.12); border: 1px solid var(--adm-border); transition: background 0.2s, border-color 0.2s; }
    .adm-slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--adm-muted); transition: transform 0.2s, background 0.2s; }
    .adm-switch input:checked + .adm-slider { background: var(--adm-accent); border-color: var(--adm-accent); }
    .adm-switch input:checked + .adm-slider::before { transform: translateX(22px); background: #000; }
    .adm-switch input:focus-visible + .adm-slider { outline: 2px solid var(--adm-accent); outline-offset: 2px; }

    .adm-brand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .adm-brand-preview {
      width: 160px; height: 46px; display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: rgba(0, 0, 0, 0.3); border: 1px solid var(--adm-border);
    }
    .adm-brand-preview img { max-height: 40px; max-width: 150px; object-fit: contain; }

    /* Buttons */
    .adm-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; margin: 0; padding: 0 16px;
      font: inherit; font-size: 0.82em; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap;
      border: 1px solid var(--adm-border); background: transparent; color: var(--adm-text);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .adm-btn:hover { text-decoration: none; }
    .adm-btn-primary { background: var(--adm-accent); border-color: var(--adm-accent); color: #000; text-transform: uppercase; letter-spacing: 0.06em; }
    .adm-btn-primary:hover { background: transparent; color: var(--adm-accent); }
    .adm-btn-ghost { color: var(--adm-muted); }
    .adm-btn-ghost:hover { color: var(--adm-text); border-color: var(--adm-accent); }
    .adm-btn-danger { border-color: rgba(220, 53, 69, 0.5); color: #ff6b6b; }
    .adm-btn-danger:hover { background: rgba(220, 53, 69, 0.15); }
    .adm-btn:disabled { opacity: 0.4; cursor: not-allowed; background: transparent; }
    .adm-btn:focus-visible { outline: 2px solid var(--adm-accent); outline-offset: 2px; }

    .adm-status { font-size: 0.8em; font-weight: 700; min-height: 1em; }
    .adm-status-row { display: block; padding: 0 16px 12px; }
    .adm-status-row:empty { display: none; }

    @media (max-width: 600px) {
      .adm-row { flex-wrap: wrap; }
      .adm-tools { grid-template-columns: 1fr; }
    }
  </style>
